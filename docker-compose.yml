# vacaverse — deployed as a standalone container publishing a direct host
# port, deliberately NOT behind this box's shared Traefik. There's no DNS
# record pointed at this VPS for a vacaverse domain (and no way to provision
# one from this deploy), so Traefik's Host()-rule routing and Let's Encrypt
# cert issuance can't work here. A direct published port needs neither and
# is fully isolated from the other live projects' Traefik routing — this
# stack cannot affect them, and `docker compose down` here only ever touches
# containers under this project name.
#
# PINNED PROJECT NAME — same reason as every other stack on this box: Compose
# defaults the project name to the directory name, which collides with other
# projects and makes `docker compose down` remove containers by the wrong
# label. Always name the stack explicitly.
#
# IMAGE, NOT BUILD: this box's deploy mechanism (Hostinger's project API)
# only ever materializes this compose file's contents on the VPS — it does
# not clone the repo, so a `build:` context has no source to build from
# (confirmed: tried both a bare repo URL and the raw compose-file URL,
# neither produced a working build). The image is built by
# .github/workflows/docker-publish.yml on every push and published to
# ghcr.io/schifftacular/vacaverse:latest — that package must be public for
# this VPS to pull it without registry credentials it doesn't have.
name: vacaverse

services:
  app:
    image: ghcr.io/schifftacular/vacaverse:latest
    # Every deploy reapplies this same `:latest` tag, and Hostinger's deploy
    # mechanism (both the GH Action and its underlying VPS API) only pulls an
    # image when the tag isn't already cached locally — confirmed by two
    # merges to main in a row that "deployed" successfully but kept serving
    # the very first image ever pulled here. pull_policy: always forces a
    # fresh pull (checked against the registry digest) on every reapply.
    pull_policy: always
    container_name: vacaverse-app
    restart: unless-stopped
    environment:
      PORT: "8080"
      # Must match wherever the browser actually reaches this — the raw
      # VPS IP + published port, since there's no domain in front of it.
      CLIENT_ORIGIN: "http://187.127.255.209:8095"
      # Points server/db/index.js at the volume mount below, kept OUTSIDE
      # /app/server/db (see the volumes comment) so app code there is never
      # shadowed by the volume.
      DB_DIR: "/app/data"
      # Bootstraps the first admin(s) on boot (see server/db/index.js) —
      # comma-separated, case-insensitive. Safe to leave set permanently.
      ADMIN_EMAILS: "mschiff05@gmail.com"
      # Points server/lib/listmonk.js at the separate vacaverse-mail Listmonk
      # instance (deploy/listmonk/docker-compose.yml) for sending trip/family
      # email invites. LISTMONK_API_USER/LISTMONK_TX_TEMPLATE_ID aren't
      # secret — hardcoded here like CLIENT_ORIGIN/ADMIN_EMAILS above, once
      # that stack's API user and transactional template exist (TODO: update
      # these two placeholder values after completing the Listmonk/Resend
      # infra setup in the project plan). LISTMONK_API_TOKEN IS a secret and
      # is never committed here — the placeholder is substituted by
      # .github/workflows/docker-publish.yml from a GitHub Actions secret
      # before deploy.
      LISTMONK_URL: "http://187.127.255.209:8096"
      LISTMONK_API_USER: "TODO-listmonk-api-user"
      LISTMONK_API_TOKEN: "__LISTMONK_API_TOKEN__"
      LISTMONK_TX_TEMPLATE_ID: "TODO-listmonk-template-id"
    ports:
      - "0.0.0.0:8095:8080"
    volumes:
      # Deliberately NOT mounted at /app/server/db: that path also holds
      # index.js/schema.sql baked into the image. A named volume only
      # copies the image's directory content into itself on the volume's
      # FIRST ever use — every deploy after that, the volume's own frozen
      # copies silently shadow whatever the new image actually ships,
      # permanently freezing app code at whichever version happened to be
      # live when the volume was created. (Discovered when the admin panel
      # migration in db/index.js never ran, despite being in every image
      # pulled since — the volume was still serving an index.js from
      # months earlier.) Mounting at /app/data instead means only the
      # sqlite file lives on the volume; DB_DIR above tells the app to
      # look there. schema.sql is read from the code path and exec'd
      # against whatever's on the volume, so an empty /app/data still
      # initializes correctly on first boot.
      - vacaverse-db:/app/data
      - vacaverse-uploads:/app/server/uploads

volumes:
  vacaverse-db:
  vacaverse-uploads:
